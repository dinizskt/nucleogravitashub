<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Arial, sans-serif">

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#260850" stop-opacity="0.9"/><stop offset="1" stop-color="#260850" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c1fc4" stop-opacity="0.4"/><stop offset="100%" stop-color="#6c1fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8a3bdb" stop-opacity="0.22"/><stop offset="100%" stop-color="#8a3bdb" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8a3bdb" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141020"/><stop offset="1" stop-color="#0d0913"/>
    </linearGradient>
    <linearGradient id="calloutFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d1428"/><stop offset="1" stop-color="#150f1d"/>
    </linearGradient>
  </defs>


    <rect width="1600" height="900" fill="#060107"/>
    <circle cx="1620" cy="-40" r="280" fill="url(#blob1)"/>
    <circle cx="-60" cy="960" r="260" fill="url(#blob2)"/>
  

    <rect x="60" y="26" width="341" height="28" rx="14" fill="#17111f" stroke="#260850"/>
    <text x="230.5" y="45" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">FUNDAMENTOS ESTRATÉGICOS · SEÇÃO 01</text>
  <text x="58" y="118" fill="#f3eef6" font-size="54" font-weight="800">Nível de Consciência</text><text x="60" y="156" fill="#a698af" font-size="18">Os 5 níveis da escala AIDA — a régua que define comunicação, criativo e blocos de página.</text><rect x="60" y="180" width="1480" height="2" fill="url(#divider)"/>
    <g transform="translate(1500,52)" filter="url(#softGlow)">
      <rect x="-46" y="-46" width="92" height="92" rx="20" fill="#17111f" stroke="url(#accent)" stroke-width="2"/>
      <g transform="rotate(45)">
        <rect x="-24" y="-24" width="48" height="48" rx="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
      </g>
      <text x="0" y="-3" fill="#f3eef6" font-size="11" font-weight="800" text-anchor="middle">NÚCLEO</text>
      <text x="0" y="12" fill="#8a3bdb" font-size="11" font-weight="800" text-anchor="middle">GRAVITAS</text>
    </g>
  <rect x="60" y="214" width="1480" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="60" y="214" width="1480" height="48" rx="20" fill="#17111f"/><rect x="60" y="238" width="1480" height="24" fill="#17111f"/><text x="90" y="245" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1">NÍVEL</text><text x="530" y="245" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1">O QUE SENTE</text><text x="1230" y="245" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1">AIDA</text><text x="90" y="319.4" fill="#f3eef6" font-size="22" font-weight="800">1 · Inconsciente</text><text x="530" y="319.4" fill="#a698af" font-size="16.5">Nem percebe o problema</text><text x="1230" y="319.4" fill="#7a6c82" font-size="16">—</text><line x1="60" y1="362.8" x2="1540" y2="362.8" stroke="#1c0d22"/><text x="90" y="420.2" fill="#f3eef6" font-size="22" font-weight="800">2 · Consciente do Problema</text><text x="530" y="420.2" fill="#a698af" font-size="16.5">Sente dor, não conhece soluções</text><rect x="1230" y="397.2" width="140" height="32" rx="16" fill="url(#accent)"/><text x="1300" y="419.2" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">ATENÇÃO</text><line x1="60" y1="463.6" x2="1540" y2="463.6" stroke="#1c0d22"/><text x="90" y="521" fill="#f3eef6" font-size="22" font-weight="800">3 · Consciente da Solução</text><text x="530" y="521" fill="#a698af" font-size="16.5">Conhece soluções no mercado</text><rect x="1230" y="498" width="140" height="32" rx="16" fill="url(#accent)"/><text x="1300" y="520" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">INTERESSE</text><line x1="60" y1="564.4" x2="1540" y2="564.4" stroke="#1c0d22"/><text x="90" y="621.8" fill="#f3eef6" font-size="22" font-weight="800">4 · Consciente do Produto</text><text x="530" y="621.8" fill="#a698af" font-size="16.5">Já viu / ouviu falar do seu produto</text><rect x="1230" y="598.8" width="140" height="32" rx="16" fill="url(#accent)"/><text x="1300" y="620.8" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">DESEJO</text><line x1="60" y1="665.1999999999999" x2="1540" y2="665.1999999999999" stroke="#1c0d22"/><text x="90" y="722.5999999999999" fill="#f3eef6" font-size="22" font-weight="800">5 · Totalmente Consciente</text><text x="530" y="722.5999999999999" fill="#a698af" font-size="16.5">Conhece, sabe o preço, sabe que resolve</text><rect x="1230" y="699.5999999999999" width="140" height="32" rx="16" fill="url(#accent)"/><text x="1300" y="721.5999999999999" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">AÇÃO</text><rect x="60" y="786" width="1480" height="96" rx="14" fill="url(#calloutFill)" stroke="#260850" stroke-width="1.5"/><rect x="60" y="786" width="6" height="96" rx="3" fill="#8a3bdb"/><text x="90" y="814" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2">LEI CENTRAL DO NÚCLEO GRAVITAS</text><text x="90" y="838" fill="#f3eef6" font-size="17" font-weight="600">No Núcleo Gravitas, nunca trabalhamos público inconsciente.</text><text x="90" y="863" fill="#f3eef6" font-size="17" font-weight="600">A gravidade só puxa quem já está perto: consciente do problema, da solução ou do produto.</text>
</svg>
