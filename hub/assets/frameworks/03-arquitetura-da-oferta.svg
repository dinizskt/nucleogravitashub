        <text x="102" y="319" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">09 ELEMENTOS</text><circle cx="94" cy="352" r="3" fill="#8a3bdb"/><text x="106" y="357" fill="#f3eef6" font-size="15.5">Nicho</text><circle cx="94" cy="380" r="3" fill="#8a3bdb"/><text x="106" y="385" fill="#f3eef6" font-size="15.5">Subnicho</text><circle cx="94" cy="408" r="3" fill="#8a3bdb"/><text x="106" y="413" fill="#f3eef6" font-size="15.5">Persona</text><circle cx="94" cy="436" r="3" fill="#8a3bdb"/><text x="106" y="441" fill="#f3eef6" font-size="15.5">Dor</text><circle cx="94" cy="464" r="3" fill="#8a3bdb"/><text x="106" y="469" fill="#f3eef6" font-size="15.5">Desejo</text><circle cx="94" cy="492" r="3" fill="#8a3bdb"/><text x="106" y="497" fill="#f3eef6" font-size="15.5">Pensamento interno</text><circle cx="94" cy="520" r="3" fill="#8a3bdb"/><text x="106" y="525" fill="#f3eef6" font-size="15.5">Resultado final</text><circle cx="94" cy="548" r="3" fill="#8a3bdb"/><text x="106" y="553" fill="#f3eef6" font-size="15.5">Mecanismo da solução</text><circle cx="94" cy="576" r="3" fill="#8a3bdb"/><text x="106" y="581" fill="#f3eef6" font-size="15.5">Formato</text><rect x="90" y="650" width="430" height="84" rx="10" fill="#17111f" stroke="#260850"/><text x="110" y="676" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">VALIDAÇÃO</text><text x="110" y="700" fill="#f3eef6" font-size="15" font-weight="700">O mercado reconhece o problema</text><text x="110" y="722" fill="#f3eef6" font-size="15" font-weight="700">e deseja essa transformação?</text>

