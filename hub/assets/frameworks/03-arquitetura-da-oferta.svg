e="15.5">Mecanismo da solução</text><rect x="90" y="543" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="116" y="558" fill="#f3eef6" font-size="15.5">Formato</text><rect x="86" y="678" width="425.3333333333333" height="70" rx="10" fill="#17111f" stroke="#260850"/><text x="102" y="700" fill="#8a3bdb" font-size="11" font-weight="700" letter-spacing="1">VALIDAÇÃO</text><text x="102" y="722" fill="#f3eef6" font-size="13" font-weight="600">O mercado reconhece o problema e deseja</text><text x="102" y="740" fill="#f3eef6" font-size="13" font-weight="600">essa transformação?</text><rect x="561.3333333333333" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="561.3333333333333" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/><text x="591.3333333333333" y="252" fill="#f3eef6" font-size="21" font-weight="800">OFERTA</text><text x="591.3333333333333" y="272" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="0.6">PERCEPÇÃO DE VALOR</text><rect x="591.3333333333333" y="288" width="120" height="24" rx="12" fill="#260850" opacity="0.55"/><text x="651.3333333333333" y="304" fill="#8a3bdb" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">08 ELEMENTOS</text><rect x="591.3333333333333" y="327" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="617.3333333333333" y="342" fill="#f3eef6" font-size="15.5">Promessa</text><rect x="591.3333333333333" y="354" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="617.3333333333333" y="369" fill="#f3eef6" font-size="15.5">Nome do produto</text><rect x="591.3333333333333" y="381" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="617.3333333333333" y="396" fill="#f3eef6" font-size="15.5">Composição do produto</text><rect x="591.3333333333333" y="408" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="617.3333333333333" y="423" fill="#f3eef6" font-size="15.5">Vantagens</text><rect x="591.3333333333333" y="435" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="617.3333333333333" y="450" fill="#f3eef6" font-size="15.5">Bônus</text><rect x="591.3333333333333" y="462" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="617.3333333333333" y="477" fill="#f3eef6" font-size="15.5">Valor de venda</text><rect x="591.3333333333333" y="489" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="617.3333333333333" y="504" fill="#f3eef6" font-size="15.5">Benefícios</text><rect x="591.3333333333333" y="516" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="617.3333333333333" y="531" fill="#f3eef6" font-size="15.5">Copy e comunicação</text><rect x="587.3333333333333" y="678" width="425.3333333333333" height="70" rx="10" fill="#17111f" stroke="#260850"/><text x="603.3333333333333" y="700" fill="#8a3bdb" font-size="11" font-weight="700" letter-spacing="1">VALIDAÇÃO</text><text x="603.3333333333333" y="722" fill="#f3eef6" font-size="13" font-weight="600">A proposta comunica valor, gera desejo e</text><text x="603.3333333333333" y="740" fill="#f3eef6" font-size="13" font-weight="600">facilita a decisão?</text><rect x="1062.6666666666665" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="1062.6666666666665" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/><text x="1092.6666666666665" y="252" fill="#f3eef6" font-size="21" font-weight="800">PRODUTO</text><text x="1092.6666666666665" y="272" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="0.6">TRANSFORMAÇÃO REAL</text><rect x="1092.6666666666665" y="288" width="120" height="24" rx="12" fill="#260850" opacity="0.55"/><text x="1152.6666666666665" y="304" fill="#8a3bdb" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">04 ELEMENTOS</text><rect x="1092.6666666666665" y="327" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="1118.6666666666665" y="342" fill="#f3eef6" font-size="15.5">Conteúdo</text><rect x="1092.6666666666665" y="359" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="1118.6666666666665" y="374" fill="#f3eef6" font-size="15.5">Visual</text><rect x="1092.6666666666665" y="391" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="1118.6666666666665" y="406" fill="#f3eef6" font-size="15.5">Experiência de consumo</text><rect x="1092.6666666666665" y="423" width="16" height="16" rx="4" fill="none" stroke="#8a3bdb" stroke-width="1.6"/><text x="1118.6666666666665" y="438" fill="#f3eef6" font-size="15.5">Entrega</text><rect x="1088.6666666666665" y="618" width="425.3333333333333" height="46" rx="10" fill="#17111f" stroke="#260850"/><text x="1104.6666666666665" y="637" fill="#e8b73d" font-size="10.5" font-weight="700" letter-spacing="1">REGRA DE OURO</text><text x="1104.6666666666665" y="656" fill="#f3eef6" font-size="14" font-weight="700">Prometer, entregar e superar.</text><rect x="1088.6666666666665" y="678" width="425.3333333333333" height="70" rx="10" fill="#17111f" stroke="#260850"/><text x="1104.6666666666665" y="700" fill="#8a3bdb" font-size="11" font-weight="700" letter-spacing="1">VALIDAÇÃO</text><text x="1104.6666666666665" y="722" fill="#f3eef6" font-size="13" font-weight="600">A entrega cumpre a transformação</text><text x="1104.6666666666665" y="740" fill="#f3eef6" font-size="13" font-weight="600">prometida?</text><rect x="60" y="786" width="1480" height="78" rx="14" fill="url(#calloutFill)" stroke="#260850" stroke-width="1.5"/><rect x="60" y="786" width="6" height="78" rx="3" fill="#8a3bdb"/><text x="90" y="814" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2">PRINCÍPIO</text><text x="90" y="838" fill="#f3eef6" font-size="17" font-weight="600">Antes de escalar, valide cada camada — uma falha na concepção enfraquece a oferta e compromete o produto.</text>
