<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Arial, sans-serif">

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#260850" stop-opacity="0.9"/><stop offset="1" stop-color="#260850" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c1fc4" stop-opacity="0.4"/><stop offset="100%" stop-color="#6c1fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8a3bdb" stop-opacity="0.22"/><stop offset="100%" stop-color="#8a3bdb" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8a3bdb" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141020"/><stop offset="1" stop-color="#0d0913"/>
    </linearGradient>
    <linearGradient id="calloutFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d1428"/><stop offset="1" stop-color="#150f1d"/>
    </linearGradient>
  </defs>


    <rect width="1600" height="900" fill="#060107"/>
    <circle cx="1620" cy="-40" r="280" fill="url(#blob1)"/>
    <circle cx="-60" cy="960" r="260" fill="url(#blob2)"/>
  

    <rect x="60" y="26" width="229.2" height="28" rx="14" fill="#17111f" stroke="#260850"/>
    <text x="174.6" y="45" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">DIAGNÓSTICO E CORREÇÃO</text>
  <text x="58" y="118" fill="#f3eef6" font-size="54" font-weight="800">7 Erros que Travam o Low Ticket</text><text x="60" y="156" fill="#a698af" font-size="18">O problema, a consequência e a solução prática.</text><rect x="60" y="180" width="1480" height="2" fill="url(#divider)"/>
    <g transform="translate(1500,52)" filter="url(#softGlow)">
      <rect x="-46" y="-46" width="92" height="92" rx="20" fill="#17111f" stroke="url(#accent)" stroke-width="2"/>
      <g transform="rotate(45)">
        <rect x="-24" y="-24" width="48" height="48" rx="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
      </g>
      <text x="0" y="-3" fill="#f3eef6" font-size="11" font-weight="800" text-anchor="middle">NÚCLEO</text>
      <text x="0" y="12" fill="#8a3bdb" font-size="11" font-weight="800" text-anchor="middle">GRAVITAS</text>
    </g>
  <rect x="60" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="60" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/><text x="90" y="252" fill="#f3eef6" font-size="22" font-weight="800">OFERTA</text><text x="90" y="272" fill="#8a3bdb" font-size="11.5" font-weight="700" letter-spacing="0.6">PROMESSA, PREÇO E PLANOS</text><text x="90" y="306" fill="#ff5d6c" font-size="10.5" font-weight="800" letter-spacing="1">ERRO</text><text x="90" y="326" fill="#f3eef6" font-size="16" font-weight="700">Produto amplo demais</text><text x="90" y="344" fill="#a698af" font-size="12.5">A pessoa não entende qual dor será</text><text x="90" y="360" fill="#a698af" font-size="12.5">resolvida.</text><rect x="90" y="369" width="417.3333333333333" height="52" rx="8" fill="#17111f" stroke="#260850"/><text x="104" y="382" fill="#8a3bdb" font-size="9.5" font-weight="700" letter-spacing="1">SOLUÇÃO</text><text x="104" y="398" fill="#f3eef6" font-size="12.5" font-weight="600">Uma dor + uma promessa + um resultado</text><text x="104" y="414" fill="#f3eef6" font-size="12.5" font-weight="600">específico.</text><text x="90" y="451.33333333333337" fill="#ff5d6c" font-size="10.5" font-weight="800" letter-spacing="1">ERRO</text><text x="90" y="471.33333333333337" fill="#f3eef6" font-size="16" font-weight="700">Preço sem validação</text><text x="90" y="489.33333333333337" fill="#a698af" font-size="12.5">Cobrar alto sem prova aumenta resistência</text><text x="90" y="505.33333333333337" fill="#a698af" font-size="12.5">e CPA.</text><rect x="90" y="514.3333333333334" width="417.3333333333333" height="52" rx="8" fill="#17111f" stroke="#260850"/><text x="104" y="527.3333333333334" fill="#8a3bdb" font-size="9.5" font-weight="700" letter-spacing="1">SOLUÇÃO</text><text x="104" y="543.3333333333334" fill="#f3eef6" font-size="12.5" font-weight="600">Comece com baixa fricção, valide e teste</text><text x="104" y="559.3333333333334" fill="#f3eef6" font-size="12.5" font-weight="600">aumentos.</text><text x="90" y="596.6666666666667" fill="#ff5d6c" font-size="10.5" font-weight="800" letter-spacing="1">ERRO</text><text x="90" y="616.6666666666667" fill="#f3eef6" font-size="16" font-weight="700">Oferecer só um plano</text><text x="90" y="634.6666666666667" fill="#a698af" font-size="12.5">Sem comparação, o ticket médio fica</text><text x="90" y="650.6666666666667" fill="#a698af" font-size="12.5">limitado.</text><rect x="90" y="659.6666666666667" width="417.3333333333333" height="35" rx="8" fill="#17111f" stroke="#260850"/><text x="104" y="672.6666666666667" fill="#8a3bdb" font-size="9.5" font-weight="700" letter-spacing="1">SOLUÇÃO</text><text x="104" y="688.6666666666667" fill="#f3eef6" font-size="12.5" font-weight="600">Plano básico + completo com vantagem clara.</text><rect x="561.3333333333333" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="561.3333333333333" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/><text x="591.3333333333333" y="252" fill="#f3eef6" font-size="22" font-weight="800">CONVERSÃO</text><text x="591.3333333333333" y="272" fill="#8a3bdb" font-size="11.5" font-weight="700" letter-spacing="0.6">PÁGINA, CHECKOUT E FUNIL</text><text x="591.3333333333333" y="306" fill="#ff5d6c" font-size="10.5" font-weight="800" letter-spacing="1">ERRO</text><text x="591.3333333333333" y="326" fill="#f3eef6" font-size="16" font-weight="700">Página complexa e lenta</text><text x="591.3333333333333" y="344" fill="#a698af" font-size="12.5">Excesso de informação dispersa e derruba</text><text x="591.3333333333333" y="360" fill="#a698af" font-size="12.5">conversão.</text><rect x="591.3333333333333" y="369" width="417.3333333333333" height="52" rx="8" fill="#17111f" stroke="#260850"/><text x="605.3333333333333" y="382" fill="#8a3bdb" font-size="9.5" font-weight="700" letter-spacing="1">SOLUÇÃO</text><text x="605.3333333333333" y="398" fill="#f3eef6" font-size="12.5" font-weight="600">Headline, mockup, demonstração, prova,</text><text x="605.3333333333333" y="414" fill="#f3eef6" font-size="12.5" font-weight="600">planos e CTA.</text><text x="591.3333333333333" y="482" fill="#ff5d6c" font-size="10.5" font-weight="800" letter-spacing="1">ERRO</text><text x="591.3333333333333" y="502" fill="#f3eef6" font-size="16" font-weight="700">Vender sem funil</text><text x="591.3333333333333" y="520" fill="#a698af" font-size="12.5">Depender só da entrada limita lucro e</text><text x="591.3333333333333" y="536" fill="#a698af" font-size="12.5">escala.</text><rect x="591.3333333333333" y="545" width="417.3333333333333" height="35" rx="8" fill="#17111f" stroke="#260850"/><text x="605.3333333333333" y="558" fill="#8a3bdb" font-size="9.5" font-weight="700" letter-spacing="1">SOLUÇÃO</text><text x="605.3333333333333" y="574" fill="#f3eef6" font-size="12.5" font-weight="600">Oferta &gt; order bump &gt; upsell &gt; nova oferta.</text><rect x="587.3333333333333" y="692" width="425.3333333333333" height="54" rx="10" fill="#17111f" stroke="#260850"/><text x="603.3333333333333" y="713" fill="#8a3bdb" font-size="10.5" font-weight="700" letter-spacing="1">UPSELL IDEAL</text><text x="603.3333333333333" y="732" fill="#f3eef6" font-size="13" font-weight="600">Resolve outro problema ou acelera o</text><text x="603.3333333333333" y="749" fill="#f3eef6" font-size="13" font-weight="600">resultado.</text><rect x="1062.6666666666665" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="1062.6666666666665" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/><text x="1092.6666666666665" y="252" fill="#f3eef6" font-size="22" font-weight="800">TRÁFEGO</text><text x="1092.6666666666665" y="272" fill="#8a3bdb" font-size="11.5" font-weight="700" letter-spacing="0.6">CRIATIVOS E OTIMIZAÇÃO</text><text x="1092.6666666666665" y="306" fill="#ff5d6c" font-size="10.5" font-weight="800" letter-spacing="1">ERRO</text><text x="1092.6666666666665" y="326" fill="#f3eef6" font-size="16" font-weight="700">Poucos criativos iguais</text><text x="1092.6666666666665" y="344" fill="#a698af" font-size="12.5">Mesmo formato e ângulo não são testes</text><text x="1092.6666666666665" y="360" fill="#a698af" font-size="12.5">diferentes.</text><rect x="1092.6666666666665" y="369" width="417.3333333333333" height="52" rx="8" fill="#17111f" stroke="#260850"/><text x="1106.6666666666665" y="382" fill="#8a3bdb" font-size="9.5" font-weight="700" letter-spacing="1">SOLUÇÃO</text><text x="1106.6666666666665" y="398" fill="#f3eef6" font-size="12.5" font-weight="600">Varie dor, desejo, prova, preço, imagem,</text><text x="1106.6666666666665" y="414" fill="#f3eef6" font-size="12.5" font-weight="600">vídeo, POV e UGC.</text><text x="1092.6666666666665" y="482" fill="#ff5d6c" font-size="10.5" font-weight="800" letter-spacing="1">ERRO</text><text x="1092.6666666666665" y="502" fill="#f3eef6" font-size="16" font-weight="700">Não otimizar diariamente</text><text x="1092.6666666666665" y="520" fill="#a698af" font-size="12.5">Perdas consomem verba e vencedores</text><text x="1092.6666666666665" y="536" fill="#a698af" font-size="12.5">saturam.</text><rect x="1092.6666666666665" y="545" width="417.3333333333333" height="52" rx="8" fill="#17111f" stroke="#260850"/><text x="1106.6666666666665" y="558" fill="#8a3bdb" font-size="9.5" font-weight="700" letter-spacing="1">SOLUÇÃO</text><text x="1106.6666666666665" y="574" fill="#f3eef6" font-size="12.5" font-weight="600">Monitorar CPA/ROAS, pausar perdas e renovar</text><text x="1106.6666666666665" y="590" fill="#f3eef6" font-size="12.5" font-weight="600">criativos.</text><rect x="1088.6666666666665" y="692" width="425.3333333333333" height="54" rx="10" fill="#17111f" stroke="#260850"/><text x="1104.6666666666665" y="713" fill="#8a3bdb" font-size="10.5" font-weight="700" letter-spacing="1">PROCESSO</text><text x="1104.6666666666665" y="732" fill="#f3eef6" font-size="13" font-weight="600">Teste &gt; valide &gt; crie variações &gt;</text><text x="1104.6666666666665" y="749" fill="#f3eef6" font-size="13" font-weight="600">renove.</text><rect x="60" y="786" width="1480" height="78" rx="14" fill="url(#calloutFill)" stroke="#260850" stroke-width="1.5"/><rect x="60" y="786" width="6" height="78" rx="3" fill="#8a3bdb"/><text x="90" y="814" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2">SEQUÊNCIA</text><text x="90" y="838" fill="#f3eef6" font-size="17" font-weight="600">Oferta específica &gt; 2 planos &gt; página simples &gt; funil completo &gt; criativos variados &gt; otimização diária.</text>
</svg>
