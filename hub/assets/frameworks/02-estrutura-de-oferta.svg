<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Arial, sans-serif">
  <rect width="1600" height="900" fill="#060107"/>
  <circle cx="1560" cy="40" r="140" fill="#6c1fc4" opacity="0.18"/>
  
    
    <text x="60" y="55" fill="#8a3bdb" font-size="17" font-weight="700" letter-spacing="1.5">ESTRUTURA DE OFERTA</text>
    <text x="58" y="112" fill="#f3eef6" font-size="52" font-weight="800">CONCEPÇÃO → OFERTA → PRODUTO</text>
    <text x="60" y="150" fill="#a698af" font-size="19">Da clareza estratégica à entrega que gera transformação.</text>
    <line x1="60" y1="176" x2="1540" y2="176" stroke="#1c0d22" stroke-width="2"/>
  
    
    <g transform="translate(1500,55)">
      <path d="M -46 0 L 0 -46 L 46 0 L 0 46 Z" fill="#17111f" stroke="#8a3bdb" stroke-width="2"/>
      <text x="0" y="-3" fill="#f3eef6" font-size="11" font-weight="800" text-anchor="middle">NÚCLEO</text>
      <text x="0" y="11" fill="#8a3bdb" font-size="11" font-weight="800" text-anchor="middle">GRAVITAS</text>
    </g>
  
    
        <rect x="60" y="205" width="490" height="555" rx="18" fill="#100c17" stroke="#2a1533"/>
        <rect x="60" y="205" width="490" height="4" rx="2" fill="#6c1fc4"/>
        <circle cx="105" cy="250" r="24" fill="#6c1fc4"/>
        <text x="105" y="258" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">1</text>
        <text x="146" y="245" fill="#f3eef6" font-size="24" font-weight="800">CONCEPÇÃO</text>
        <text x="146" y="266" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="0.5">O PONTO DE PARTIDA</text>
      <text x="90" y="305" fill="#f3eef6" font-size="16">É onde a ideia ganha clareza e direção.</text><rect x="90" y="325" width="430" height="26" rx="6" fill="#260850" opacity="0.5"/>
        <text x="102" y="343" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">ESSENCIAL</text><circle cx="94" cy="376" r="3" fill="#8a3bdb"/><text x="106" y="381" fill="#f3eef6" font-size="15.5">O que será vendido</text><circle cx="94" cy="404" r="3" fill="#8a3bdb"/><text x="106" y="409" fill="#f3eef6" font-size="15.5">Para quem será criado</text><circle cx="94" cy="432" r="3" fill="#8a3bdb"/><text x="106" y="437" fill="#f3eef6" font-size="15.5">Qual problema resolve</text><circle cx="94" cy="460" r="3" fill="#8a3bdb"/><text x="106" y="465" fill="#f3eef6" font-size="15.5">Por que isso tem valor</text><rect x="90" y="650" width="430" height="84" rx="10" fill="#17111f" stroke="#260850"/><text x="110" y="676" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">RESULTADO</text><text x="110" y="700" fill="#f3eef6" font-size="15" font-weight="700">Dor, desejo e transformação</text><text x="110" y="722" fill="#f3eef6" font-size="15" font-weight="700">definidos.</text>

        <rect x="555" y="205" width="490" height="555" rx="18" fill="#100c17" stroke="#2a1533"/>
        <rect x="555" y="205" width="490" height="4" rx="2" fill="#6c1fc4"/>
        <circle cx="600" cy="250" r="24" fill="#6c1fc4"/>
        <text x="600" y="258" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">2</text>
        <text x="641" y="245" fill="#f3eef6" font-size="24" font-weight="800">OFERTA</text>
        <text x="641" y="266" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="0.5">A PONTE COM O MERCADO</text>
      <text x="585" y="305" fill="#f3eef6" font-size="16">Apresenta a ideia de forma clara, desejável e</text><text x="585" y="329" fill="#f3eef6" font-size="16">convincente.</text><rect x="585" y="349" width="430" height="26" rx="6" fill="#260850" opacity="0.5"/>
        <text x="597" y="367" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">ESSENCIAL</text><circle cx="589" cy="400" r="3" fill="#8a3bdb"/><text x="601" y="405" fill="#f3eef6" font-size="15.5">O que a pessoa compra</text><circle cx="589" cy="428" r="3" fill="#8a3bdb"/><text x="601" y="433" fill="#f3eef6" font-size="15.5">Por que precisa disso</text><circle cx="589" cy="456" r="3" fill="#8a3bdb"/><text x="601" y="461" fill="#f3eef6" font-size="15.5">Qual valor será percebido</text><circle cx="589" cy="484" r="3" fill="#8a3bdb"/><text x="601" y="489" fill="#f3eef6" font-size="15.5">Por que agir agora</text><rect x="585" y="650" width="430" height="84" rx="10" fill="#17111f" stroke="#260850"/><text x="605" y="676" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">RESULTADO</text><text x="605" y="700" fill="#f3eef6" font-size="15" font-weight="700">Valor percebido e motivo</text><text x="605" y="722" fill="#f3eef6" font-size="15" font-weight="700">para comprar.</text>

        <rect x="1050" y="205" width="490" height="555" rx="18" fill="#100c17" stroke="#2a1533"/>
        <rect x="1050" y="205" width="490" height="4" rx="2" fill="#6c1fc4"/>
        <circle cx="1095" cy="250" r="24" fill="#6c1fc4"/>
        <text x="1095" y="258" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">3</text>
        <text x="1136" y="245" fill="#f3eef6" font-size="24" font-weight="800">PRODUTO</text>
        <text x="1136" y="266" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="0.5">A ENTREGA CONCRETA</text>
      <text x="1080" y="305" fill="#f3eef6" font-size="16">É o que o cliente recebe para avançar de</text><text x="1080" y="329" fill="#f3eef6" font-size="16">verdade.</text><rect x="1080" y="349" width="430" height="26" rx="6" fill="#260850" opacity="0.5"/>
        <text x="1092" y="367" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">ESSENCIAL</text><circle cx="1084" cy="400" r="3" fill="#8a3bdb"/><text x="1096" y="405" fill="#f3eef6" font-size="15.5">A promessa realizada</text><circle cx="1084" cy="428" r="3" fill="#8a3bdb"/><text x="1096" y="433" fill="#f3eef6" font-size="15.5">A experiência de consumo</text><circle cx="1084" cy="456" r="3" fill="#8a3bdb"/><text x="1096" y="461" fill="#f3eef6" font-size="15.5">O caminho até o resultado</text><circle cx="1084" cy="484" r="3" fill="#8a3bdb"/><text x="1096" y="489" fill="#f3eef6" font-size="15.5">A transformação percebida</text><rect x="1080" y="650" width="430" height="84" rx="10" fill="#17111f" stroke="#260850"/><text x="1100" y="676" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">RESULTADO</text><text x="1100" y="700" fill="#f3eef6" font-size="15" font-weight="700">Entrega que gera mudança</text><text x="1100" y="722" fill="#f3eef6" font-size="15" font-weight="700">real.</text>
    <rect x="60" y="800" width="1480" height="70" rx="14" fill="#100c17" stroke="#260850"/>
    <rect x="60" y="800" width="5" height="70" rx="2" fill="#6c1fc4"/>
    <text x="90" y="842" fill="#f3eef6" font-size="20" font-weight="800">Concepção, oferta e produto precisam trabalhar juntos.</text>
    <text x="1530" y="842" fill="#a698af" font-size="15" text-anchor="end">Estratégia antes da execução. Clareza antes da escala.</text>
  
</svg>
