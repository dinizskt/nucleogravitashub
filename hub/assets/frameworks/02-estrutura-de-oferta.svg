<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Arial, sans-serif">

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#260850" stop-opacity="0.9"/><stop offset="1" stop-color="#260850" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c1fc4" stop-opacity="0.4"/><stop offset="100%" stop-color="#6c1fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8a3bdb" stop-opacity="0.22"/><stop offset="100%" stop-color="#8a3bdb" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8a3bdb" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141020"/><stop offset="1" stop-color="#0d0913"/>
    </linearGradient>
    <linearGradient id="calloutFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d1428"/><stop offset="1" stop-color="#150f1d"/>
    </linearGradient>
  </defs>


    <rect width="1600" height="900" fill="#060107"/>
    <circle cx="1620" cy="-40" r="280" fill="url(#blob1)"/>
    <circle cx="-60" cy="960" r="260" fill="url(#blob2)"/>
  

    <rect x="60" y="26" width="203.4" height="28" rx="14" fill="#17111f" stroke="#260850"/>
    <text x="161.7" y="45" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">ESTRUTURA DE OFERTA</text>
  <text x="58" y="118" fill="#f3eef6" font-size="54" font-weight="800">Concepção &gt; Oferta &gt; Produto</text><text x="60" y="156" fill="#a698af" font-size="18">Da clareza estratégica à entrega que gera transformação.</text><rect x="60" y="180" width="1480" height="2" fill="url(#divider)"/>
    <g transform="translate(1500,52)" filter="url(#softGlow)">
      <rect x="-46" y="-46" width="92" height="92" rx="20" fill="#17111f" stroke="url(#accent)" stroke-width="2"/>
      <g transform="rotate(45)">
        <rect x="-24" y="-24" width="48" height="48" rx="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
      </g>
      <text x="0" y="-3" fill="#f3eef6" font-size="11" font-weight="800" text-anchor="middle">NÚCLEO</text>
      <text x="0" y="12" fill="#8a3bdb" font-size="11" font-weight="800" text-anchor="middle">GRAVITAS</text>
    </g>
  <rect x="60" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="60" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/>
    <circle cx="104" cy="260" r="22" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="104" y="267.92" fill="#fff" font-size="20.9" font-weight="800" text-anchor="middle">1</text>
  <text x="142" y="254" fill="#f3eef6" font-size="23" font-weight="800">CONCEPÇÃO</text><text x="142" y="274" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="0.6">O PONTO DE PARTIDA</text><text x="90" y="314" fill="#f3eef6" font-size="15.5">É onde a ideia ganha clareza e direção.</text><rect x="90" y="337" width="417.3333333333333" height="24" rx="6" fill="#260850" opacity="0.55"/><text x="102" y="354" fill="#8a3bdb" font-size="11" font-weight="700" letter-spacing="1">ESSENCIAL</text><circle cx="94" cy="387" r="3" fill="#8a3bdb"/><text x="106" y="392" fill="#f3eef6" font-size="15">O que será vendido</text><circle cx="94" cy="414" r="3" fill="#8a3bdb"/><text x="106" y="419" fill="#f3eef6" font-size="15">Para quem será criado</text><circle cx="94" cy="441" r="3" fill="#8a3bdb"/><text x="106" y="446" fill="#f3eef6" font-size="15">Qual problema resolve</text><circle cx="94" cy="468" r="3" fill="#8a3bdb"/><text x="106" y="473" fill="#f3eef6" font-size="15">Por que isso tem valor</text><rect x="86" y="690" width="425.3333333333333" height="60" rx="10" fill="#17111f" stroke="#260850"/><text x="104" y="714" fill="#8a3bdb" font-size="11" font-weight="700" letter-spacing="1">RESULTADO</text><text x="104" y="736" fill="#f3eef6" font-size="14" font-weight="700">Dor, desejo e transformação definidos.</text><rect x="561.3333333333333" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="561.3333333333333" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/>
    <circle cx="605.3333333333333" cy="260" r="22" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="605.3333333333333" y="267.92" fill="#fff" font-size="20.9" font-weight="800" text-anchor="middle">2</text>
  <text x="643.3333333333333" y="254" fill="#f3eef6" font-size="23" font-weight="800">OFERTA</text><text x="643.3333333333333" y="274" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="0.6">A PONTE COM O MERCADO</text><text x="591.3333333333333" y="314" fill="#f3eef6" font-size="15.5">Apresenta a ideia de forma clara,</text><text x="591.3333333333333" y="336" fill="#f3eef6" font-size="15.5">desejável e convincente.</text><rect x="591.3333333333333" y="359" width="417.3333333333333" height="24" rx="6" fill="#260850" opacity="0.55"/><text x="603.3333333333333" y="376" fill="#8a3bdb" font-size="11" font-weight="700" letter-spacing="1">ESSENCIAL</text><circle cx="595.3333333333333" cy="409" r="3" fill="#8a3bdb"/><text x="607.3333333333333" y="414" fill="#f3eef6" font-size="15">O que a pessoa compra</text><circle cx="595.3333333333333" cy="436" r="3" fill="#8a3bdb"/><text x="607.3333333333333" y="441" fill="#f3eef6" font-size="15">Por que precisa disso</text><circle cx="595.3333333333333" cy="463" r="3" fill="#8a3bdb"/><text x="607.3333333333333" y="468" fill="#f3eef6" font-size="15">Qual valor será percebido</text><circle cx="595.3333333333333" cy="490" r="3" fill="#8a3bdb"/><text x="607.3333333333333" y="495" fill="#f3eef6" font-size="15">Por que agir agora</text><rect x="587.3333333333333" y="690" width="425.3333333333333" height="60" rx="10" fill="#17111f" stroke="#260850"/><text x="605.3333333333333" y="714" fill="#8a3bdb" font-size="11" font-weight="700" letter-spacing="1">RESULTADO</text><text x="605.3333333333333" y="736" fill="#f3eef6" font-size="14" font-weight="700">Valor percebido e motivo para comprar.</text><rect x="1062.6666666666665" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="1062.6666666666665" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/>
    <circle cx="1106.6666666666665" cy="260" r="22" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="1106.6666666666665" y="267.92" fill="#fff" font-size="20.9" font-weight="800" text-anchor="middle">3</text>
  <text x="1144.6666666666665" y="254" fill="#f3eef6" font-size="23" font-weight="800">PRODUTO</text><text x="1144.6666666666665" y="274" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="0.6">A ENTREGA CONCRETA</text><text x="1092.6666666666665" y="314" fill="#f3eef6" font-size="15.5">É o que o cliente recebe para avançar de</text><text x="1092.6666666666665" y="336" fill="#f3eef6" font-size="15.5">verdade.</text><rect x="1092.6666666666665" y="359" width="417.3333333333333" height="24" rx="6" fill="#260850" opacity="0.55"/><text x="1104.6666666666665" y="376" fill="#8a3bdb" font-size="11" font-weight="700" letter-spacing="1">ESSENCIAL</text><circle cx="1096.6666666666665" cy="409" r="3" fill="#8a3bdb"/><text x="1108.6666666666665" y="414" fill="#f3eef6" font-size="15">A promessa realizada</text><circle cx="1096.6666666666665" cy="436" r="3" fill="#8a3bdb"/><text x="1108.6666666666665" y="441" fill="#f3eef6" font-size="15">A experiência de consumo</text><circle cx="1096.6666666666665" cy="463" r="3" fill="#8a3bdb"/><text x="1108.6666666666665" y="468" fill="#f3eef6" font-size="15">O caminho até o resultado</text><circle cx="1096.6666666666665" cy="490" r="3" fill="#8a3bdb"/><text x="1108.6666666666665" y="495" fill="#f3eef6" font-size="15">A transformação percebida</text><rect x="1088.6666666666665" y="690" width="425.3333333333333" height="60" rx="10" fill="#17111f" stroke="#260850"/><text x="1106.6666666666665" y="714" fill="#8a3bdb" font-size="11" font-weight="700" letter-spacing="1">RESULTADO</text><text x="1106.6666666666665" y="736" fill="#f3eef6" font-size="14" font-weight="700">Entrega que gera mudança real.</text><rect x="60" y="786" width="1480" height="78" rx="14" fill="url(#calloutFill)" stroke="#260850" stroke-width="1.5"/><rect x="60" y="786" width="6" height="78" rx="3" fill="#8a3bdb"/><text x="90" y="814" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2">PRINCÍPIO</text><text x="90" y="838" fill="#f3eef6" font-size="17" font-weight="600">Concepção, oferta e produto precisam trabalhar juntos — estratégia antes da execução, clareza antes da escala.</text>
</svg>
