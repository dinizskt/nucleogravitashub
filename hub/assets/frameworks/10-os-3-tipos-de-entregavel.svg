<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Arial, sans-serif">

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#260850" stop-opacity="0.9"/><stop offset="1" stop-color="#260850" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c1fc4" stop-opacity="0.4"/><stop offset="100%" stop-color="#6c1fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8a3bdb" stop-opacity="0.22"/><stop offset="100%" stop-color="#8a3bdb" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8a3bdb" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141020"/><stop offset="1" stop-color="#0d0913"/>
    </linearGradient>
    <linearGradient id="calloutFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d1428"/><stop offset="1" stop-color="#150f1d"/>
    </linearGradient>
  </defs>


    <rect width="1600" height="900" fill="#060107"/>
    <circle cx="1620" cy="-40" r="280" fill="url(#blob1)"/>
    <circle cx="-60" cy="960" r="260" fill="url(#blob2)"/>
  

    <rect x="60" y="26" width="444.2" height="28" rx="14" fill="#17111f" stroke="#260850"/>
    <text x="282.1" y="45" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">PRODUTO, ENTREGÁVEL E TANGIBILIZAÇÃO · SEÇÃO 16</text>
  <text x="58" y="118" fill="#f3eef6" font-size="54" font-weight="800">Os 3 Tipos de Entregável</text><text x="60" y="156" fill="#a698af" font-size="18">Do MVP ao completo — a progressão certa entre iniciar a oferta e sustentar a escala.</text><rect x="60" y="180" width="1480" height="2" fill="url(#divider)"/>
    <g transform="translate(1500,52)" filter="url(#softGlow)">
      <rect x="-46" y="-46" width="92" height="92" rx="20" fill="#17111f" stroke="url(#accent)" stroke-width="2"/>
      <g transform="rotate(45)">
        <rect x="-24" y="-24" width="48" height="48" rx="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
      </g>
      <text x="0" y="-3" fill="#f3eef6" font-size="11" font-weight="800" text-anchor="middle">NÚCLEO</text>
      <text x="0" y="12" fill="#8a3bdb" font-size="11" font-weight="800" text-anchor="middle">GRAVITAS</text>
    </g>
  <rect x="60" y="214" width="1480" height="70" rx="14" fill="url(#calloutFill)" stroke="#260850" stroke-width="1.5"/><rect x="60" y="214" width="6" height="70" rx="3" fill="#8a3bdb"/><text x="90" y="242" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2">MANDAMENTO</text><text x="90" y="266" fill="#f3eef6" font-size="17" font-weight="600">"Tangibilizar é fazer a pessoa enxergar claramente o que vai receber, eliminando dúvidas e aumentando a confiança na compra."</text><rect x="60" y="308" width="477.3333333333333" height="458" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="60" y="308" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/>
    <circle cx="104" cy="354" r="22" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="104" y="361.92" fill="#fff" font-size="20.9" font-weight="800" text-anchor="middle">1</text>
  <text x="142" y="348" fill="#f3eef6" font-size="21" font-weight="800">ENTREGÁVEL MVP</text><text x="142" y="368" fill="#8a3bdb" font-size="10.5" font-weight="700" letter-spacing="0.4">MOMENTO A · INICIANDO A OFERTA</text><text x="90" y="416" fill="#f3eef6" font-size="15.5">Primeira versão na área de membros:</text><text x="90" y="440" fill="#f3eef6" font-size="15.5">conteúdo principal (pode ser um Google</text><text x="90" y="464" fill="#f3eef6" font-size="15.5">Docs simples) + 1 a 3 bônus. O que</text><text x="90" y="488" fill="#f3eef6" font-size="15.5">importa é o conteúdo entregue, não o</text><text x="90" y="512" fill="#f3eef6" font-size="15.5">design.</text><rect x="561.3333333333333" y="308" width="477.3333333333333" height="458" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="561.3333333333333" y="308" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/>
    <circle cx="605.3333333333333" cy="354" r="22" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="605.3333333333333" y="361.92" fill="#fff" font-size="20.9" font-weight="800" text-anchor="middle">2</text>
  <text x="643.3333333333333" y="348" fill="#f3eef6" font-size="21" font-weight="800">ENTREGÁVEL MODELO</text><text x="643.3333333333333" y="368" fill="#8a3bdb" font-size="10.5" font-weight="700" letter-spacing="0.4">MOMENTO A · INICIANDO A OFERTA</text><text x="591.3333333333333" y="416" fill="#f3eef6" font-size="15.5">O primeiro contato visual da persona.</text><text x="591.3333333333333" y="440" fill="#f3eef6" font-size="15.5">Escolha 5 a 10 páginas, diagrame como a</text><text x="591.3333333333333" y="464" fill="#f3eef6" font-size="15.5">versão final e use na página de vendas</text><text x="591.3333333333333" y="488" fill="#f3eef6" font-size="15.5">em mockups.</text><rect x="1062.6666666666665" y="308" width="477.3333333333333" height="458" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="1062.6666666666665" y="308" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/>
    <circle cx="1106.6666666666665" cy="354" r="22" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="1106.6666666666665" y="361.92" fill="#fff" font-size="20.9" font-weight="800" text-anchor="middle">3</text>
  <text x="1144.6666666666665" y="348" fill="#f3eef6" font-size="21" font-weight="800">ENTREGÁVEL COMPLETO</text><text x="1144.6666666666665" y="368" fill="#8a3bdb" font-size="10.5" font-weight="700" letter-spacing="0.4">MOMENTO B · OFERTA RODANDO E VENDENDO</text><text x="1092.6666666666665" y="416" fill="#f3eef6" font-size="15.5">Versão final: produto principal com</text><text x="1092.6666666666665" y="440" fill="#f3eef6" font-size="15.5">diagramação oficial e todos os bônus</text><text x="1092.6666666666665" y="464" fill="#f3eef6" font-size="15.5">organizados. É o que sustenta a escala e</text><text x="1092.6666666666665" y="488" fill="#f3eef6" font-size="15.5">o longo prazo.</text><rect x="60" y="786" width="1480" height="78" rx="14" fill="url(#calloutFill)" stroke="#260850" stroke-width="1.5"/><rect x="60" y="786" width="6" height="78" rx="3" fill="#ff5d6c"/><text x="90" y="814" fill="#ff5d6c" font-size="13" font-weight="700" letter-spacing="1.2">✕ ERRO</text><text x="90" y="838" fill="#f3eef6" font-size="17" font-weight="600">Produzir e diagramar todo o produto e todos os bônus e não vender. Não fique 15, 20, 30 dias criando sem colocar pra rodar.</text>
</svg>
