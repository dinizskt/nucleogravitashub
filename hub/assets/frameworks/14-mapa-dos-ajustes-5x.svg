    <circle cx="110" cy="514" r="22" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="110" y="521.92" fill="#fff" font-size="20.9" font-weight="800" text-anchor="middle">3</text>
  <text x="148" y="521" fill="#f3eef6" font-size="19" font-weight="700">Nova página de vendas</text><text x="870" y="520" fill="#8a3bdb" font-size="15.5" font-weight="700">Connect Rate / CKT — custo por finalização</text><line x1="60" y1="564.4" x2="1540" y2="564.4" stroke="#1c0d22"/>
    <circle cx="110" cy="614.8" r="22" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="110" y="622.7199999999999" fill="#fff" font-size="20.9" font-weight="800" text-anchor="middle">4</text>
  <text x="148" y="621.8" fill="#f3eef6" font-size="19" font-weight="700">Novo checkout</text><text x="870" y="620.8" fill="#8a3bdb" font-size="15.5" font-weight="700">CV Checkout / CV Order Bump</text><line x1="60" y1="665.1999999999999" x2="1540" y2="665.1999999999999" stroke="#1c0d22"/>
    <circle cx="110" cy="715.5999999999999" r="22" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="110" y="723.5199999999999" fill="#fff" font-size="20.9" font-weight="800" text-anchor="middle">5</text>
  <text x="148" y="722.5999999999999" fill="#f3eef6" font-size="19" font-weight="700">Nova oferta</text><text x="870" y="711.5999999999999" fill="#8a3bdb" font-size="15.5" font-weight="700">ROAS negativo ou baixo após rodada(s) de</text><text x="870" y="731.5999999999999" fill="#8a3bdb" font-size="15.5" font-weight="700">ajustes</text><rect x="60" y="786" width="1480" height="84" rx="14" fill="url(#calloutFill)" stroke="#260850" stroke-width="1.5"/><rect x="60" y="786" width="6" height="84" rx="3" fill="#8a3bdb"/><text x="90" y="814" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2">LÓGICA CENTRAL</text><text x="90" y="838" fill="#f3eef6" font-size="17" font-weight="600">Cada métrica quebrada aponta para um ajuste específico. A métrica é o sintoma; o ajuste é o tratamento.</text>
</svg>
