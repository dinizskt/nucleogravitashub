<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Arial, sans-serif">

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#260850" stop-opacity="0.9"/><stop offset="1" stop-color="#260850" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c1fc4" stop-opacity="0.4"/><stop offset="100%" stop-color="#6c1fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8a3bdb" stop-opacity="0.22"/><stop offset="100%" stop-color="#8a3bdb" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8a3bdb" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141020"/><stop offset="1" stop-color="#0d0913"/>
    </linearGradient>
    <linearGradient id="calloutFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d1428"/><stop offset="1" stop-color="#150f1d"/>
    </linearGradient>
  </defs>


    <rect width="1600" height="900" fill="#060107"/>
    <circle cx="1620" cy="-40" r="280" fill="url(#blob1)"/>
    <circle cx="-60" cy="960" r="260" fill="url(#blob2)"/>
  

    <rect x="60" y="26" width="306.59999999999997" height="28" rx="14" fill="#17111f" stroke="#260850"/>
    <text x="213.29999999999998" y="45" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">O NÚCLEO DA OPERAÇÃO · SEÇÃO 26</text>
  <text x="58" y="118" fill="#f3eef6" font-size="54" font-weight="800">Mapa dos Ajustes 5×</text><text x="60" y="156" fill="#a698af" font-size="18">Visão geral: qual métrica quebrada aponta para qual ajuste.</text><rect x="60" y="180" width="1480" height="2" fill="url(#divider)"/>
    <g transform="translate(1500,52)" filter="url(#softGlow)">
      <rect x="-46" y="-46" width="92" height="92" rx="20" fill="#17111f" stroke="url(#accent)" stroke-width="2"/>
      <g transform="rotate(45)">
        <rect x="-24" y="-24" width="48" height="48" rx="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
      </g>
      <text x="0" y="-3" fill="#f3eef6" font-size="11" font-weight="800" text-anchor="middle">NÚCLEO</text>
      <text x="0" y="12" fill="#8a3bdb" font-size="11" font-weight="800" text-anchor="middle">GRAVITAS</text>
    </g>
  <rect x="60" y="214" width="1480" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="60" y="214" width="1480" height="48" rx="20" fill="#17111f"/><rect x="60" y="238" width="1480" height="24" fill="#17111f"/><text x="90" y="245" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1">TIPO DE AJUSTE</text><text x="870" y="245" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1">MÉTRICA QUE APONTA</text>
    <circle cx="110" cy="312.4" r="22" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="110" y="320.32" fill="#fff" font-size="20.9" font-weight="800" text-anchor="middle">1</text>
  <text x="148" y="319.4" fill="#f3eef6" font-size="19" font-weight="700">Troca de estrutura do Facebook</text><text x="870" y="318.4" fill="#8a3bdb" font-size="15.5" font-weight="700">CPM — custo por mil impressões</text><line x1="60" y1="362.8" x2="1540" y2="362.8" stroke="#1c0d22"/>
    <circle cx="110" cy="413.2" r="22" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="110" y="421.12" fill="#fff" font-size="20.9" font-weight="800" text-anchor="middle">2</text>
