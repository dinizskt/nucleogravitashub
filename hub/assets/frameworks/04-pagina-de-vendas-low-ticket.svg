        <text x="641" y="245" fill="#f3eef6" font-size="24" font-weight="800">ESTRUTURA</text>
        <text x="641" y="266" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="0.5">ORDEM QUE CONDUZ</text>
      <rect x="585" y="301" width="430" height="26" rx="6" fill="#260850" opacity="0.5"/>
        <text x="597" y="319" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">08 ELEMENTOS</text><circle cx="589" cy="352" r="3" fill="#8a3bdb"/><text x="601" y="357" fill="#f3eef6" font-size="15.5">Sequência lógica de blocos</text><circle cx="589" cy="380" r="3" fill="#8a3bdb"/><text x="601" y="385" fill="#f3eef6" font-size="15.5">Conexão fluida, sem saltos</text><circle cx="589" cy="408" r="3" fill="#8a3bdb"/><text x="601" y="413" fill="#f3eef6" font-size="15.5">Produto reforçado em pontos estratégicos</text><circle cx="589" cy="436" r="3" fill="#8a3bdb"/><text x="601" y="441" fill="#f3eef6" font-size="15.5">Blocos adequados à consciência da persona</text><circle cx="589" cy="464" r="3" fill="#8a3bdb"/><text x="601" y="469" fill="#f3eef6" font-size="15.5">CTA no início, no meio e no fim</text><circle cx="589" cy="492" r="3" fill="#8a3bdb"/><text x="601" y="497" fill="#f3eef6" font-size="15.5">Equilíbrio entre emoção e razão</text><circle cx="589" cy="520" r="3" fill="#8a3bdb"/><text x="601" y="525" fill="#f3eef6" font-size="15.5">Contraste claro entre planos</text><circle cx="589" cy="548" r="3" fill="#8a3bdb"/><text x="601" y="553" fill="#f3eef6" font-size="15.5">Rodapé com garantia e suporte</text><rect x="585" y="650" width="430" height="84" rx="10" fill="#17111f" stroke="#260850"/><text x="605" y="676" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">OBJETIVO</text><text x="605" y="700" fill="#f3eef6" font-size="15" font-weight="700">Conduzir da dor até a decisão</text><text x="605" y="722" fill="#f3eef6" font-size="15" font-weight="700">de compra.</text>

        <rect x="1050" y="205" width="490" height="555" rx="18" fill="#100c17" stroke="#2a1533"/>
