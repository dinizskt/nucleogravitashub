<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Arial, sans-serif">

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#260850" stop-opacity="0.9"/><stop offset="1" stop-color="#260850" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c1fc4" stop-opacity="0.4"/><stop offset="100%" stop-color="#6c1fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8a3bdb" stop-opacity="0.22"/><stop offset="100%" stop-color="#8a3bdb" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8a3bdb" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141020"/><stop offset="1" stop-color="#0d0913"/>
    </linearGradient>
    <linearGradient id="calloutFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d1428"/><stop offset="1" stop-color="#150f1d"/>
    </linearGradient>
  </defs>


    <rect width="1600" height="900" fill="#060107"/>
    <circle cx="1620" cy="-40" r="280" fill="url(#blob1)"/>
    <circle cx="-60" cy="960" r="260" fill="url(#blob2)"/>
  

    <rect x="60" y="26" width="177.6" height="28" rx="14" fill="#17111f" stroke="#260850"/>
    <text x="148.8" y="45" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">CONVERSÃO DIRETA</text>
  <text x="58" y="118" fill="#f3eef6" font-size="54" font-weight="800">Página de Vendas Low Ticket</text><text x="60" y="156" fill="#a698af" font-size="18">Comunicação, estrutura e visual — o que torna o produto tangível e persuasivo.</text><rect x="60" y="180" width="1480" height="2" fill="url(#divider)"/>
    <g transform="translate(1500,52)" filter="url(#softGlow)">
      <rect x="-46" y="-46" width="92" height="92" rx="20" fill="#17111f" stroke="url(#accent)" stroke-width="2"/>
      <g transform="rotate(45)">
        <rect x="-24" y="-24" width="48" height="48" rx="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
      </g>
      <text x="0" y="-3" fill="#f3eef6" font-size="11" font-weight="800" text-anchor="middle">NÚCLEO</text>
      <text x="0" y="12" fill="#8a3bdb" font-size="11" font-weight="800" text-anchor="middle">GRAVITAS</text>
    </g>
  <rect x="60" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="60" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/><text x="90" y="252" fill="#f3eef6" font-size="22" font-weight="800">COMUNICAÇÃO</text><text x="90" y="272" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="0.6">CLAREZA QUE CONVERTE</text><circle cx="94" cy="305" r="3" fill="#8a3bdb"/><text x="106" y="310" fill="#f3eef6" font-size="14">Headline direta e ligada ao</text><text x="106" y="327" fill="#f3eef6" font-size="14">benefício</text><circle cx="94" cy="356.7142857142857" r="3" fill="#8a3bdb"/><text x="106" y="361.7142857142857" fill="#f3eef6" font-size="14">Texto claro, específico e sem</text><text x="106" y="378.7142857142857" fill="#f3eef6" font-size="14">jargões</text><circle cx="94" cy="408.42857142857144" r="3" fill="#8a3bdb"/><text x="106" y="413.42857142857144" fill="#f3eef6" font-size="14">Frases curtas e escaneáveis</text><circle cx="94" cy="460.14285714285717" r="3" fill="#8a3bdb"/><text x="106" y="465.14285714285717" fill="#f3eef6" font-size="14">Promessa conectada ao produto e à</text><text x="106" y="482.14285714285717" fill="#f3eef6" font-size="14">persona</text><circle cx="94" cy="511.8571428571429" r="3" fill="#8a3bdb"/><text x="106" y="516.8571428571429" fill="#f3eef6" font-size="14">Cada bloco responde a uma dor ou</text><text x="106" y="533.8571428571429" fill="#f3eef6" font-size="14">desejo</text><circle cx="94" cy="563.5714285714286" r="3" fill="#8a3bdb"/><text x="106" y="568.5714285714286" fill="#f3eef6" font-size="14">Tom de voz adequado ao público</text><circle cx="94" cy="615.2857142857142" r="3" fill="#8a3bdb"/><text x="106" y="620.2857142857142" fill="#f3eef6" font-size="14">Objeções antecipadas no texto</text><rect x="86" y="696" width="425.3333333333333" height="52" rx="10" fill="#17111f" stroke="#260850"/><text x="102" y="717" fill="#8a3bdb" font-size="10.5" font-weight="700" letter-spacing="1">OBJETIVO</text><text x="102" y="736" fill="#f3eef6" font-size="13" font-weight="600">Fazer a pessoa pensar: isso foi feito</text><text x="102" y="753" fill="#f3eef6" font-size="13" font-weight="600">para mim.</text><rect x="561.3333333333333" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="561.3333333333333" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/><text x="591.3333333333333" y="252" fill="#f3eef6" font-size="22" font-weight="800">ESTRUTURA</text><text x="591.3333333333333" y="272" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="0.6">ORDEM QUE CONDUZ</text><circle cx="595.3333333333333" cy="305" r="3" fill="#8a3bdb"/><text x="607.3333333333333" y="310" fill="#f3eef6" font-size="14">Sequência lógica de blocos</text><circle cx="595.3333333333333" cy="350.25" r="3" fill="#8a3bdb"/><text x="607.3333333333333" y="355.25" fill="#f3eef6" font-size="14">Conexão fluida, sem saltos</text><circle cx="595.3333333333333" cy="395.5" r="3" fill="#8a3bdb"/><text x="607.3333333333333" y="400.5" fill="#f3eef6" font-size="14">Produto reforçado em pontos</text><text x="607.3333333333333" y="417.5" fill="#f3eef6" font-size="14">estratégicos</text><circle cx="595.3333333333333" cy="440.75" r="3" fill="#8a3bdb"/><text x="607.3333333333333" y="445.75" fill="#f3eef6" font-size="14">Blocos adequados à consciência da</text><text x="607.3333333333333" y="462.75" fill="#f3eef6" font-size="14">persona</text><circle cx="595.3333333333333" cy="486" r="3" fill="#8a3bdb"/><text x="607.3333333333333" y="491" fill="#f3eef6" font-size="14">CTA no início, no meio e no fim</text><circle cx="595.3333333333333" cy="531.25" r="3" fill="#8a3bdb"/><text x="607.3333333333333" y="536.25" fill="#f3eef6" font-size="14">Equilíbrio entre emoção e razão</text><circle cx="595.3333333333333" cy="576.5" r="3" fill="#8a3bdb"/><text x="607.3333333333333" y="581.5" fill="#f3eef6" font-size="14">Contraste claro entre planos</text><circle cx="595.3333333333333" cy="621.75" r="3" fill="#8a3bdb"/><text x="607.3333333333333" y="626.75" fill="#f3eef6" font-size="14">Rodapé com garantia e suporte</text><rect x="587.3333333333333" y="696" width="425.3333333333333" height="52" rx="10" fill="#17111f" stroke="#260850"/><text x="603.3333333333333" y="717" fill="#8a3bdb" font-size="10.5" font-weight="700" letter-spacing="1">OBJETIVO</text><text x="603.3333333333333" y="736" fill="#f3eef6" font-size="13" font-weight="600">Conduzir da dor até a decisão de compra.</text><rect x="1062.6666666666665" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="1062.6666666666665" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/><text x="1092.6666666666665" y="252" fill="#f3eef6" font-size="22" font-weight="800">VISUAL</text><text x="1092.6666666666665" y="272" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="0.6">FORMA QUE TANGIBILIZA</text><circle cx="1096.6666666666665" cy="305" r="3" fill="#8a3bdb"/><text x="1108.6666666666665" y="310" fill="#f3eef6" font-size="14">Mockups e prévias do produto</text><circle cx="1096.6666666666665" cy="350.25" r="3" fill="#8a3bdb"/><text x="1108.6666666666665" y="355.25" fill="#f3eef6" font-size="14">Botões com contraste</text><circle cx="1096.6666666666665" cy="395.5" r="3" fill="#8a3bdb"/><text x="1108.6666666666665" y="400.5" fill="#f3eef6" font-size="14">Espaçamento entre seções</text><circle cx="1096.6666666666665" cy="440.75" r="3" fill="#8a3bdb"/><text x="1108.6666666666665" y="445.75" fill="#f3eef6" font-size="14">Hierarquia de tamanhos e pesos</text><circle cx="1096.6666666666665" cy="486" r="3" fill="#8a3bdb"/><text x="1108.6666666666665" y="491" fill="#f3eef6" font-size="14">Ícones e setas que orientam</text><circle cx="1096.6666666666665" cy="531.25" r="3" fill="#8a3bdb"/><text x="1108.6666666666665" y="536.25" fill="#f3eef6" font-size="14">Amostras e prints da entrega</text><circle cx="1096.6666666666665" cy="576.5" r="3" fill="#8a3bdb"/><text x="1108.6666666666665" y="581.5" fill="#f3eef6" font-size="14">Layout limpo e organizado</text><circle cx="1096.6666666666665" cy="621.75" r="3" fill="#8a3bdb"/><text x="1108.6666666666665" y="626.75" fill="#f3eef6" font-size="14">Urgência sem poluição visual</text><rect x="1088.6666666666665" y="696" width="425.3333333333333" height="52" rx="10" fill="#17111f" stroke="#260850"/><text x="1104.6666666666665" y="717" fill="#8a3bdb" font-size="10.5" font-weight="700" letter-spacing="1">OBJETIVO</text><text x="1104.6666666666665" y="736" fill="#f3eef6" font-size="13" font-weight="600">Tornar o valor visível e aumentar a</text><text x="1104.6666666666665" y="753" fill="#f3eef6" font-size="13" font-weight="600">credibilidade.</text><rect x="60" y="786" width="1480" height="78" rx="14" fill="url(#calloutFill)" stroke="#260850" stroke-width="1.5"/><rect x="60" y="786" width="6" height="78" rx="3" fill="#8a3bdb"/><text x="90" y="814" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2">SÍNTESE</text><text x="90" y="838" fill="#f3eef6" font-size="17" font-weight="600">A copy atrai. A estrutura conduz. O visual torna a promessa concreta.</text>
</svg>
