        <text x="105" y="258" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">1</text>
        <text x="146" y="245" fill="#f3eef6" font-size="24" font-weight="800">COMUNICAÇÃO</text>
        <text x="146" y="266" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="0.5">CLAREZA QUE CONVERTE</text>
      <rect x="90" y="301" width="430" height="26" rx="6" fill="#260850" opacity="0.5"/>
        <text x="102" y="319" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">07 ELEMENTOS</text><circle cx="94" cy="352" r="3" fill="#8a3bdb"/><text x="106" y="357" fill="#f3eef6" font-size="15.5">Headline direta e ligada ao benefício</text><circle cx="94" cy="380" r="3" fill="#8a3bdb"/><text x="106" y="385" fill="#f3eef6" font-size="15.5">Texto claro, específico e sem jargões</text><circle cx="94" cy="408" r="3" fill="#8a3bdb"/><text x="106" y="413" fill="#f3eef6" font-size="15.5">Frases curtas e escaneáveis</text><circle cx="94" cy="436" r="3" fill="#8a3bdb"/><text x="106" y="441" fill="#f3eef6" font-size="15.5">Promessa conectada ao produto e à persona</text><circle cx="94" cy="464" r="3" fill="#8a3bdb"/><text x="106" y="469" fill="#f3eef6" font-size="15.5">Cada bloco responde a uma dor ou desejo</text><circle cx="94" cy="492" r="3" fill="#8a3bdb"/><text x="106" y="497" fill="#f3eef6" font-size="15.5">Tom de voz adequado ao público</text><circle cx="94" cy="520" r="3" fill="#8a3bdb"/><text x="106" y="525" fill="#f3eef6" font-size="15.5">Objeções antecipadas no texto</text><rect x="90" y="650" width="430" height="84" rx="10" fill="#17111f" stroke="#260850"/><text x="110" y="676" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">OBJETIVO</text><text x="110" y="700" fill="#f3eef6" font-size="15" font-weight="700">Fazer a pessoa pensar: isso foi</text><text x="110" y="722" fill="#f3eef6" font-size="15" font-weight="700">feito para mim.</text>

        <rect x="555" y="205" width="490" height="555" rx="18" fill="#100c17" stroke="#2a1533"/>
        <rect x="555" y="205" width="490" height="4" rx="2" fill="#6c1fc4"/>
