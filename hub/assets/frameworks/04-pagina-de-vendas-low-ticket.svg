    <text x="60" y="55" fill="#8a3bdb" font-size="17" font-weight="700" letter-spacing="1.5">CONVERSÃO DIRETA</text>
    <text x="58" y="112" fill="#f3eef6" font-size="52" font-weight="800">PÁGINA DE VENDAS LOW TICKET</text>
    <text x="60" y="150" fill="#a698af" font-size="19">Comunicação objetiva, estrutura lógica e visual que torna o produto tangível.</text>
    <line x1="60" y1="176" x2="1540" y2="176" stroke="#1c0d22" stroke-width="2"/>
  
    
