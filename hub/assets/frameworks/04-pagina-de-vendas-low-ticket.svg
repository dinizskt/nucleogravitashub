        <text x="1136" y="266" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="0.5">FORMA QUE TANGIBILIZA</text>
      <rect x="1080" y="301" width="430" height="26" rx="6" fill="#260850" opacity="0.5"/>
        <text x="1092" y="319" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">09 ELEMENTOS</text><circle cx="1084" cy="352" r="3" fill="#8a3bdb"/><text x="1096" y="357" fill="#f3eef6" font-size="15.5">Mockups e prévias do produto</text><circle cx="1084" cy="380" r="3" fill="#8a3bdb"/><text x="1096" y="385" fill="#f3eef6" font-size="15.5">Botões com contraste</text><circle cx="1084" cy="408" r="3" fill="#8a3bdb"/><text x="1096" y="413" fill="#f3eef6" font-size="15.5">Espaçamento entre seções</text><circle cx="1084" cy="436" r="3" fill="#8a3bdb"/><text x="1096" y="441" fill="#f3eef6" font-size="15.5">Hierarquia de tamanhos e pesos</text><circle cx="1084" cy="464" r="3" fill="#8a3bdb"/><text x="1096" y="469" fill="#f3eef6" font-size="15.5">Ícones e setas que orientam</text><circle cx="1084" cy="492" r="3" fill="#8a3bdb"/><text x="1096" y="497" fill="#f3eef6" font-size="15.5">Amostras e prints da entrega</text><circle cx="1084" cy="520" r="3" fill="#8a3bdb"/><text x="1096" y="525" fill="#f3eef6" font-size="15.5">Layout limpo e organizado</text><circle cx="1084" cy="548" r="3" fill="#8a3bdb"/><text x="1096" y="553" fill="#f3eef6" font-size="15.5">Aparência profissional</text><circle cx="1084" cy="576" r="3" fill="#8a3bdb"/><text x="1096" y="581" fill="#f3eef6" font-size="15.5">Urgência sem poluição visual</text><rect x="1080" y="650" width="430" height="84" rx="10" fill="#17111f" stroke="#260850"/><text x="1100" y="676" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">OBJETIVO</text><text x="1100" y="700" fill="#f3eef6" font-size="15" font-weight="700">Tornar o valor visível e aumentar</text><text x="1100" y="722" fill="#f3eef6" font-size="15" font-weight="700">a credibilidade.</text>
