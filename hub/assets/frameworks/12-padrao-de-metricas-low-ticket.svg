  <text x="58" y="118" fill="#f3eef6" font-size="54" font-weight="800">Padrão Básico de Métricas para Low Ticket</text><text x="60" y="156" fill="#a698af" font-size="18">Bom, médio e ruim, por métrica, tendo o ticket médio (TM) como referência.</text><rect x="60" y="180" width="1480" height="2" fill="url(#divider)"/>
