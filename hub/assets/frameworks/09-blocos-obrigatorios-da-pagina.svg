<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Arial, sans-serif">

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#260850" stop-opacity="0.9"/><stop offset="1" stop-color="#260850" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c1fc4" stop-opacity="0.4"/><stop offset="100%" stop-color="#6c1fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8a3bdb" stop-opacity="0.22"/><stop offset="100%" stop-color="#8a3bdb" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8a3bdb" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141020"/><stop offset="1" stop-color="#0d0913"/>
    </linearGradient>
    <linearGradient id="calloutFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d1428"/><stop offset="1" stop-color="#150f1d"/>
    </linearGradient>
  </defs>


    <rect width="1600" height="900" fill="#060107"/>
    <circle cx="1620" cy="-40" r="280" fill="url(#blob1)"/>
    <circle cx="-60" cy="960" r="260" fill="url(#blob2)"/>
  

    <rect x="60" y="26" width="366.8" height="28" rx="14" fill="#17111f" stroke="#260850"/>
    <text x="243.4" y="45" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">PÁGINA DE VENDAS LOW TICKET · SEÇÃO 06</text>
  <text x="58" y="118" fill="#f3eef6" font-size="54" font-weight="800">Blocos Obrigatórios em Todas as Ofertas</text><text x="60" y="156" fill="#a698af" font-size="18">10 blocos que toda página Gravitas precisa ter, na ordem certa.</text><rect x="60" y="180" width="1480" height="2" fill="url(#divider)"/>
    <g transform="translate(1500,52)" filter="url(#softGlow)">
      <rect x="-46" y="-46" width="92" height="92" rx="20" fill="#17111f" stroke="url(#accent)" stroke-width="2"/>
      <g transform="rotate(45)">
        <rect x="-24" y="-24" width="48" height="48" rx="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
      </g>
      <text x="0" y="-3" fill="#f3eef6" font-size="11" font-weight="800" text-anchor="middle">NÚCLEO</text>
      <text x="0" y="12" fill="#8a3bdb" font-size="11" font-weight="800" text-anchor="middle">GRAVITAS</text>
    </g>
  <rect x="60" y="214" width="728" height="97.6" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="98" cy="262.8" r="20" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="98" y="270" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">01</text>
  <text x="132" y="254.8" fill="#f3eef6" font-size="18" font-weight="800">Venda Imediata</text><text x="132" y="276.8" fill="#a698af" font-size="13">Headline (promessa única) &gt; imagem tangível &gt; explicação &gt; botão</text><text x="132" y="293.8" fill="#a698af" font-size="13">para os planos.</text><rect x="60" y="327.6" width="728" height="97.6" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="98" cy="376.40000000000003" r="20" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="98" y="383.6" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">02</text>
  <text x="132" y="368.40000000000003" fill="#f3eef6" font-size="18" font-weight="800">Demonstrativo</text><text x="132" y="390.40000000000003" fill="#a698af" font-size="13">Prévia do produto por dentro. Gera confiança: o cliente vê o que</text><text x="132" y="407.40000000000003" fill="#a698af" font-size="13">vai receber.</text><rect x="60" y="441.2" width="728" height="97.6" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="98" cy="490" r="20" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="98" y="497.2" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">03</text>
  <text x="132" y="482" fill="#f3eef6" font-size="18" font-weight="800">Benefícios do Produto</text><text x="132" y="504" fill="#a698af" font-size="13">Headline + tópicos visuais. Ninguém compra um ebook — compra a</text><text x="132" y="521" fill="#a698af" font-size="13">transformação.</text><rect x="60" y="554.8" width="728" height="97.6" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="98" cy="603.5999999999999" r="20" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="98" y="610.8" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">04</text>
  <text x="132" y="595.5999999999999" fill="#f3eef6" font-size="18" font-weight="800">Urgência + Botão</text><text x="132" y="617.5999999999999" fill="#a698af" font-size="13">"Acesse ainda hoje". Quebra o "deixo pra depois".</text><rect x="60" y="668.4" width="728" height="97.6" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="98" cy="717.1999999999999" r="20" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="98" y="724.4" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">05</text>
  <text x="132" y="709.1999999999999" fill="#f3eef6" font-size="18" font-weight="800">Ideal Para Você Que Deseja</text><text x="132" y="731.1999999999999" fill="#a698af" font-size="13">Ícone &gt; título &gt; explicação. "Esse produto foi feito pra mim."</text><rect x="812" y="214" width="728" height="97.6" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="850" cy="262.8" r="20" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="850" y="270" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">06</text>
  <text x="884" y="254.8" fill="#f3eef6" font-size="18" font-weight="800">Tudo o Que Você Vai Receber</text><text x="884" y="276.8" fill="#a698af" font-size="13">Mockup + nome + tópicos. O cliente sabe o que compra.</text><rect x="812" y="327.6" width="728" height="97.6" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="850" cy="376.40000000000003" r="20" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="850" y="383.6" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">07</text>
  <text x="884" y="368.40000000000003" fill="#f3eef6" font-size="18" font-weight="800">Bônus</text><text x="884" y="390.40000000000003" fill="#a698af" font-size="13">Mockup &gt; número &gt; nome + explicação. "Recebo muito mais."</text><rect x="812" y="441.2" width="728" height="97.6" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="850" cy="490" r="20" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="850" y="497.2" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">08</text>
  <text x="884" y="482" fill="#f3eef6" font-size="18" font-weight="800">Oferta e Valores</text><text x="884" y="504" fill="#a698af" font-size="13">Plano básico vs completo (bônus + ancoragem + economia +</text><text x="884" y="521" fill="#a698af" font-size="13">urgência).</text><rect x="812" y="554.8" width="728" height="97.6" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="850" cy="603.5999999999999" r="20" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="850" y="610.8" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">09</text>
  <text x="884" y="595.5999999999999" fill="#f3eef6" font-size="18" font-weight="800">Perguntas Frequentes</text><text x="884" y="617.5999999999999" fill="#a698af" font-size="13">Acesso, garantia, pagamento. Antecipar objeções destrava a</text><text x="884" y="634.5999999999999" fill="#a698af" font-size="13">decisão.</text><rect x="812" y="668.4" width="728" height="97.6" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="850" cy="717.1999999999999" r="20" fill="url(#accent)" filter="url(#softGlow)"/>
    <text x="850" y="724.4" fill="#fff" font-size="19" font-weight="800" text-anchor="middle">10</text>
  <text x="884" y="709.1999999999999" fill="#f3eef6" font-size="18" font-weight="800">Rodapé</text><text x="884" y="731.1999999999999" fill="#a698af" font-size="13">Suporte, política, CNPJ ou marca. Profissionalismo e segurança</text><text x="884" y="748.1999999999999" fill="#a698af" font-size="13">jurídica.</text>
</svg>
