<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Arial, sans-serif">
  <rect width="1600" height="900" fill="#060107"/>
  <circle cx="1560" cy="40" r="140" fill="#6c1fc4" opacity="0.18"/>
  
  
    <text x="60" y="55" fill="#8a3bdb" font-size="17" font-weight="700" letter-spacing="1.5">LEITURA DE DADOS</text>
    <text x="58" y="112" fill="#f3eef6" font-size="52" font-weight="800">MÉTRICAS DA UTMIFY</text>
    <text x="60" y="150" fill="#a698af" font-size="19">12 siglas essenciais para analisar do anúncio ao lucro.</text>
    <line x1="60" y1="176" x2="1540" y2="176" stroke="#1c0d22" stroke-width="2"/>
  
  
    <g transform="translate(1500,55)">
      <path d="M -46 0 L 0 -46 L 46 0 L 0 46 Z" fill="#17111f" stroke="#8a3bdb" stroke-width="2"/>
      <text x="0" y="-3" fill="#f3eef6" font-size="11" font-weight="800" text-anchor="middle">NÚCLEO</text>
      <text x="0" y="11" fill="#8a3bdb" font-size="11" font-weight="800" text-anchor="middle">GRAVITAS</text>
    </g>
  
  
    <rect x="60" y="205" width="490" height="555" rx="18" fill="#100c17" stroke="#2a1533"/>
    <rect x="60" y="205" width="490" height="4" rx="2" fill="#6c1fc4"/>
  
    <circle cx="105" cy="250" r="24" fill="#6c1fc4"/>
    <text x="105" y="258" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">1</text>
    <text x="146" y="245" fill="#f3eef6" font-size="22" font-weight="800">TRÁFEGO</text>
    <text x="146" y="266" fill="#8a3bdb" font-size="12.5" font-weight="700" letter-spacing="0.5">CUSTO, ALCANCE E CLIQUE</text>
  
      <line x1="90" y1="305" x2="295" y2="305" stroke="#1c0d22" stroke-width="1.5"/>
      <text x="90" y="339" fill="#8a3bdb" font-size="30" font-weight="800">CPM</text>
      <text x="160" y="323" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">CUSTO POR MIL</text><text x="90" y="361" fill="#f3eef6" font-size="12.5">Custo para exibir o</text><text x="90" y="377" fill="#f3eef6" font-size="12.5">anúncio mil vezes.</text><text x="90" y="401" fill="#8a3bdb" font-size="12" font-weight="700">Gasto ÷ impressões × 1.000</text>

      <line x1="315" y1="305" x2="520" y2="305" stroke="#1c0d22" stroke-width="1.5"/>
      <text x="315" y="339" fill="#8a3bdb" font-size="30" font-weight="800">CTR</text>
      <text x="385" y="323" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">TAXA DE CLIQUES</text><text x="315" y="361" fill="#f3eef6" font-size="12.5">Percentual de pessoas</text><text x="315" y="377" fill="#f3eef6" font-size="12.5">que viram e clicaram.</text><text x="315" y="401" fill="#8a3bdb" font-size="12" font-weight="700">Cliques ÷ impressões × 100</text>
      <line x1="90" y1="435" x2="295" y2="435" stroke="#1c0d22" stroke-width="1.5"/>
      <text x="90" y="469" fill="#8a3bdb" font-size="30" font-weight="800">CPC</text>
      <text x="160" y="453" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">CUSTO POR</text><text x="160" y="465" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">CLIQUE</text><text x="90" y="491" fill="#f3eef6" font-size="12.5">Quanto você paga por</text><text x="90" y="507" fill="#f3eef6" font-size="12.5">visita gerada.</text><text x="90" y="531" fill="#8a3bdb" font-size="12" font-weight="700">Gasto ÷ cliques</text>

      <line x1="315" y1="435" x2="520" y2="435" stroke="#1c0d22" stroke-width="1.5"/>
      <text x="315" y="469" fill="#8a3bdb" font-size="30" font-weight="800">LPV</text>
      <text x="385" y="453" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">VISITA À PÁGINA</text><text x="315" y="491" fill="#f3eef6" font-size="12.5">Clicou e realmente</text><text x="315" y="507" fill="#f3eef6" font-size="12.5">carregou a página.</text><text x="315" y="531" fill="#8a3bdb" font-size="12" font-weight="700">Baixo = lentidão ou erro</text><rect x="90" y="660" width="430" height="70" rx="10" fill="#17111f" stroke="#260850"/><text x="110" y="684" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">COMO LER</text><text x="110" y="706" fill="#f3eef6" font-size="14" font-weight="600">CTR baixo costuma elevar o CPC. Revise</text><text x="110" y="726" fill="#f3eef6" font-size="14" font-weight="600">criativo e público.</text>
  
    <rect x="555" y="205" width="490" height="555" rx="18" fill="#100c17" stroke="#2a1533"/>
    <rect x="555" y="205" width="490" height="4" rx="2" fill="#6c1fc4"/>
  
    <circle cx="600" cy="250" r="24" fill="#6c1fc4"/>
    <text x="600" y="258" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">2</text>
    <text x="641" y="245" fill="#f3eef6" font-size="22" font-weight="800">CONVERSÃO</text>
    <text x="641" y="266" fill="#8a3bdb" font-size="12.5" font-weight="700" letter-spacing="0.5">DA INTENÇÃO À COMPRA</text>
  
      <line x1="585" y1="305" x2="790" y2="305" stroke="#1c0d22" stroke-width="1.5"/>
      <text x="585" y="339" fill="#8a3bdb" font-size="30" font-weight="800">IC</text>
      <text x="635" y="323" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">INÍCIO DE</text><text x="635" y="335" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">CHECKOUT</text><text x="585" y="361" fill="#f3eef6" font-size="12.5">Demonstração de</text><text x="585" y="377" fill="#f3eef6" font-size="12.5">intenção real de</text><text x="585" y="393" fill="#f3eef6" font-size="12.5">compra.</text><text x="585" y="417" fill="#8a3bdb" font-size="12" font-weight="700">Poucos ICs = oferta fraca</text>

      <line x1="810" y1="305" x2="1015" y2="305" stroke="#1c0d22" stroke-width="1.5"/>
      <text x="810" y="339" fill="#8a3bdb" font-size="30" font-weight="800">CVR</text>
      <text x="880" y="323" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">TAXA DE</text><text x="880" y="335" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">CONVERSÃO</text><text x="810" y="361" fill="#f3eef6" font-size="12.5">Percentual de</text><text x="810" y="377" fill="#f3eef6" font-size="12.5">visitantes que</text><text x="810" y="393" fill="#f3eef6" font-size="12.5">compraram.</text><text x="810" y="417" fill="#8a3bdb" font-size="12" font-weight="700">Vendas ÷ visitas × 100</text>
      <line x1="585" y1="435" x2="790" y2="435" stroke="#1c0d22" stroke-width="1.5"/>
      <text x="585" y="469" fill="#8a3bdb" font-size="30" font-weight="800">CPA</text>
      <text x="655" y="453" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">CUSTO POR</text><text x="655" y="465" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">AQUISIÇÃO</text><text x="585" y="491" fill="#f3eef6" font-size="12.5">Gasto em anúncios para</text><text x="585" y="507" fill="#f3eef6" font-size="12.5">gerar uma venda.</text><text x="585" y="531" fill="#8a3bdb" font-size="12" font-weight="700">Gasto ÷ vendas</text>

      <line x1="810" y1="435" x2="1015" y2="435" stroke="#1c0d22" stroke-width="1.5"/>
      <text x="810" y="469" fill="#8a3bdb" font-size="30" font-weight="800">CAC</text>
      <text x="880" y="453" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">CUSTO DO</text><text x="880" y="465" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">CLIENTE</text><text x="810" y="491" fill="#f3eef6" font-size="12.5">Custo total para</text><text x="810" y="507" fill="#f3eef6" font-size="12.5">conquistar um cliente.</text><text x="810" y="531" fill="#8a3bdb" font-size="12" font-weight="700">Marketing + vendas ÷ clientes</text><rect x="585" y="660" width="430" height="70" rx="10" fill="#17111f" stroke="#260850"/><text x="605" y="684" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">COMO LER</text><text x="605" y="706" fill="#f3eef6" font-size="14" font-weight="600">CVR baixa e CPA alto apontam problema na</text><text x="605" y="726" fill="#f3eef6" font-size="14" font-weight="600">página ou oferta.</text>
  
    <rect x="1050" y="205" width="490" height="555" rx="18" fill="#100c17" stroke="#2a1533"/>
    <rect x="1050" y="205" width="490" height="4" rx="2" fill="#6c1fc4"/>
  
    <circle cx="1095" cy="250" r="24" fill="#6c1fc4"/>
    <text x="1095" y="258" fill="#fff" font-size="20" font-weight="800" text-anchor="middle">3</text>
    <text x="1136" y="245" fill="#f3eef6" font-size="22" font-weight="800">RESULTADO</text>
    <text x="1136" y="266" fill="#8a3bdb" font-size="12.5" font-weight="700" letter-spacing="0.5">FATURAMENTO E LUCRO</text>
  
      <line x1="1080" y1="305" x2="1285" y2="305" stroke="#1c0d22" stroke-width="1.5"/>
      <text x="1080" y="339" fill="#8a3bdb" font-size="30" font-weight="800">AOV</text>
      <text x="1150" y="323" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">TICKET MÉDIO</text><text x="1080" y="361" fill="#f3eef6" font-size="12.5">Valor médio faturado</text><text x="1080" y="377" fill="#f3eef6" font-size="12.5">por pedido.</text><text x="1080" y="401" fill="#8a3bdb" font-size="12" font-weight="700">Faturamento ÷ vendas</text>

      <line x1="1305" y1="305" x2="1510" y2="305" stroke="#1c0d22" stroke-width="1.5"/>
      <text x="1305" y="339" fill="#8a3bdb" font-size="30" font-weight="800">ROAS</text>
      <text x="1395" y="323" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">RETORNO DO</text><text x="1395" y="335" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">ANÚNCIO</text><text x="1305" y="361" fill="#f3eef6" font-size="12.5">Faturamento por R$1</text><text x="1305" y="377" fill="#f3eef6" font-size="12.5">investido em mídia.</text><text x="1305" y="401" fill="#8a3bdb" font-size="12" font-weight="700">Faturamento ÷ anúncios</text>
      <line x1="1080" y1="435" x2="1285" y2="435" stroke="#1c0d22" stroke-width="1.5"/>
      <text x="1080" y="469" fill="#8a3bdb" font-size="30" font-weight="800">ROI</text>
      <text x="1150" y="453" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">RETORNO TOTAL</text><text x="1080" y="491" fill="#f3eef6" font-size="12.5">Lucro real após todos</text><text x="1080" y="507" fill="#f3eef6" font-size="12.5">os custos.</text><text x="1080" y="531" fill="#8a3bdb" font-size="12" font-weight="700">Lucro ÷ investimento × 100</text>

      <line x1="1305" y1="435" x2="1510" y2="435" stroke="#1c0d22" stroke-width="1.5"/>
      <text x="1305" y="469" fill="#8a3bdb" font-size="30" font-weight="800">LTV</text>
      <text x="1375" y="453" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">VALOR DO</text><text x="1375" y="465" fill="#a698af" font-size="9.5" font-weight="700" letter-spacing="0.4">CLIENTE</text><text x="1305" y="491" fill="#f3eef6" font-size="12.5">Valor gerado ao longo</text><text x="1305" y="507" fill="#f3eef6" font-size="12.5">do relacionamento.</text><text x="1305" y="531" fill="#8a3bdb" font-size="12" font-weight="700">Ticket × compras por cliente</text><rect x="1080" y="660" width="430" height="50" rx="10" fill="#17111f" stroke="#260850"/><text x="1100" y="684" fill="#8a3bdb" font-size="12" font-weight="700" letter-spacing="1">COMO LER</text><text x="1100" y="706" fill="#f3eef6" font-size="14" font-weight="600">ROAS mede mídia. ROI confirma se sobrou lucro.</text>
  <rect x="60" y="800" width="1480" height="70" rx="14" fill="#100c17" stroke="#260850"/>
  <rect x="60" y="800" width="5" height="70" rx="2" fill="#6c1fc4"/>
  <text x="90" y="842" fill="#f3eef6" font-size="19" font-weight="800">CPM → CTR → CPC → LPV → IC → CVR → CPA → ROAS → ROI</text>
  <text x="1530" y="836" fill="#a698af" font-size="13" text-anchor="end">Lucro real = faturamento - anúncios -</text>
  <text x="1530" y="852" fill="#a698af" font-size="13" text-anchor="end">taxas - impostos - custos.</text>

</svg>
