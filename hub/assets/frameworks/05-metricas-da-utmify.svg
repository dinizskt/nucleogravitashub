<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Inter, Arial, sans-serif">

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="accentV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3bdb"/><stop offset="1" stop-color="#5a17a8"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#260850" stop-opacity="0.9"/><stop offset="1" stop-color="#260850" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blob1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6c1fc4" stop-opacity="0.4"/><stop offset="100%" stop-color="#6c1fc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8a3bdb" stop-opacity="0.22"/><stop offset="100%" stop-color="#8a3bdb" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#8a3bdb" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="cardFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141020"/><stop offset="1" stop-color="#0d0913"/>
    </linearGradient>
    <linearGradient id="calloutFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1d1428"/><stop offset="1" stop-color="#150f1d"/>
    </linearGradient>
  </defs>


    <rect width="1600" height="900" fill="#060107"/>
    <circle cx="1620" cy="-40" r="280" fill="url(#blob1)"/>
    <circle cx="-60" cy="960" r="260" fill="url(#blob2)"/>
  

    <rect x="60" y="26" width="177.6" height="28" rx="14" fill="#17111f" stroke="#260850"/>
    <text x="148.8" y="45" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2" text-anchor="middle">LEITURA DE DADOS</text>
  <text x="58" y="118" fill="#f3eef6" font-size="54" font-weight="800">Métricas da Utmify</text><text x="60" y="156" fill="#a698af" font-size="18">12 siglas essenciais para analisar do anúncio ao lucro.</text><rect x="60" y="180" width="1480" height="2" fill="url(#divider)"/>
    <g transform="translate(1500,52)" filter="url(#softGlow)">
      <rect x="-46" y="-46" width="92" height="92" rx="20" fill="#17111f" stroke="url(#accent)" stroke-width="2"/>
      <g transform="rotate(45)">
        <rect x="-24" y="-24" width="48" height="48" rx="8" fill="none" stroke="url(#accent)" stroke-width="2"/>
      </g>
      <text x="0" y="-3" fill="#f3eef6" font-size="11" font-weight="800" text-anchor="middle">NÚCLEO</text>
      <text x="0" y="12" fill="#8a3bdb" font-size="11" font-weight="800" text-anchor="middle">GRAVITAS</text>
    </g>
  <rect x="60" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="60" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/><text x="90" y="250" fill="#f3eef6" font-size="21" font-weight="800">TRÁFEGO</text><text x="90" y="269" fill="#8a3bdb" font-size="11.5" font-weight="700" letter-spacing="0.6">CUSTO, ALCANCE E CLIQUE</text><line x1="90" y1="292" x2="507.33333333333326" y2="292" stroke="#1c0d22"/><text x="90" y="322" fill="#8a3bdb" font-size="24" font-weight="800">CPM</text><text x="90" y="336" fill="#7a6c82" font-size="9" font-weight="700" letter-spacing="0.4">CUSTO POR MIL</text><text x="90" y="354" fill="#f3eef6" font-size="11.5">Custo para exibir o</text><text x="90" y="368" fill="#f3eef6" font-size="11.5">anúncio mil vezes.</text><text x="90" y="388" fill="#8a3bdb" font-size="11" font-weight="700">Gasto ÷ impressões × 1.000</text><text x="308.66666666666663" y="322" fill="#8a3bdb" font-size="24" font-weight="800">CTR</text><text x="308.66666666666663" y="336" fill="#7a6c82" font-size="9" font-weight="700" letter-spacing="0.4">TAXA DE CLIQUES</text><text x="308.66666666666663" y="354" fill="#f3eef6" font-size="11.5">Percentual de quem</text><text x="308.66666666666663" y="368" fill="#f3eef6" font-size="11.5">viu e clicou.</text><text x="308.66666666666663" y="388" fill="#8a3bdb" font-size="11" font-weight="700">Cliques ÷ impressões × 100</text><line x1="90" y1="480" x2="507.33333333333326" y2="480" stroke="#1c0d22"/><text x="90" y="510" fill="#8a3bdb" font-size="24" font-weight="800">CPC</text><text x="90" y="524" fill="#7a6c82" font-size="9" font-weight="700" letter-spacing="0.4">CUSTO POR CLIQUE</text><text x="90" y="542" fill="#f3eef6" font-size="11.5">Quanto você paga</text><text x="90" y="556" fill="#f3eef6" font-size="11.5">por visita gerada.</text><text x="90" y="576" fill="#8a3bdb" font-size="11" font-weight="700">Gasto ÷ cliques</text><text x="308.66666666666663" y="510" fill="#8a3bdb" font-size="24" font-weight="800">LPV</text><text x="308.66666666666663" y="524" fill="#7a6c82" font-size="9" font-weight="700" letter-spacing="0.4">VISITA À PÁGINA</text><text x="308.66666666666663" y="542" fill="#f3eef6" font-size="11.5">Clicou e carregou a</text><text x="308.66666666666663" y="556" fill="#f3eef6" font-size="11.5">página.</text><text x="308.66666666666663" y="576" fill="#8a3bdb" font-size="11" font-weight="700">Baixo = lentidão ou erro</text><rect x="86" y="688" width="425.3333333333333" height="58" rx="10" fill="#17111f" stroke="#260850"/><text x="102" y="710" fill="#8a3bdb" font-size="11" font-weight="700" letter-spacing="1">COMO LER</text><text x="102" y="730" fill="#f3eef6" font-size="13" font-weight="600">CTR baixo costuma elevar o CPC. Revise</text><text x="102" y="748" fill="#f3eef6" font-size="13" font-weight="600">criativo e público.</text><rect x="561.3333333333333" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="561.3333333333333" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/><text x="591.3333333333333" y="250" fill="#f3eef6" font-size="21" font-weight="800">CONVERSÃO</text><text x="591.3333333333333" y="269" fill="#8a3bdb" font-size="11.5" font-weight="700" letter-spacing="0.6">DA INTENÇÃO À COMPRA</text><line x1="591.3333333333333" y1="292" x2="1008.6666666666665" y2="292" stroke="#1c0d22"/><text x="591.3333333333333" y="322" fill="#8a3bdb" font-size="24" font-weight="800">IC</text><text x="591.3333333333333" y="336" fill="#7a6c82" font-size="9" font-weight="700" letter-spacing="0.4">INÍCIO DE CHECKOUT</text><text x="591.3333333333333" y="354" fill="#f3eef6" font-size="11.5">Intenção real de</text><text x="591.3333333333333" y="368" fill="#f3eef6" font-size="11.5">compra.</text><text x="591.3333333333333" y="388" fill="#8a3bdb" font-size="11" font-weight="700">Poucos ICs = oferta fraca</text><text x="809.9999999999999" y="322" fill="#8a3bdb" font-size="24" font-weight="800">CVR</text><text x="809.9999999999999" y="336" fill="#7a6c82" font-size="9" font-weight="700" letter-spacing="0.4">TAXA DE CONVERSÃO</text><text x="809.9999999999999" y="354" fill="#f3eef6" font-size="11.5">Visitantes que</text><text x="809.9999999999999" y="368" fill="#f3eef6" font-size="11.5">compraram.</text><text x="809.9999999999999" y="388" fill="#8a3bdb" font-size="11" font-weight="700">Vendas ÷ visitas × 100</text><line x1="591.3333333333333" y1="480" x2="1008.6666666666665" y2="480" stroke="#1c0d22"/><text x="591.3333333333333" y="510" fill="#8a3bdb" font-size="24" font-weight="800">CPA</text><text x="591.3333333333333" y="524" fill="#7a6c82" font-size="9" font-weight="700" letter-spacing="0.4">CUSTO POR AQUISIÇÃO</text><text x="591.3333333333333" y="542" fill="#f3eef6" font-size="11.5">Gasto por venda</text><text x="591.3333333333333" y="556" fill="#f3eef6" font-size="11.5">gerada.</text><text x="591.3333333333333" y="576" fill="#8a3bdb" font-size="11" font-weight="700">Gasto ÷ vendas</text><text x="809.9999999999999" y="510" fill="#8a3bdb" font-size="24" font-weight="800">CAC</text><text x="809.9999999999999" y="524" fill="#7a6c82" font-size="9" font-weight="700" letter-spacing="0.4">CUSTO DO CLIENTE</text><text x="809.9999999999999" y="542" fill="#f3eef6" font-size="11.5">Custo total por</text><text x="809.9999999999999" y="556" fill="#f3eef6" font-size="11.5">cliente.</text><text x="809.9999999999999" y="576" fill="#8a3bdb" font-size="11" font-weight="700">Mkt + vendas ÷ clientes</text><rect x="587.3333333333333" y="688" width="425.3333333333333" height="58" rx="10" fill="#17111f" stroke="#260850"/><text x="603.3333333333333" y="710" fill="#8a3bdb" font-size="11" font-weight="700" letter-spacing="1">COMO LER</text><text x="603.3333333333333" y="730" fill="#f3eef6" font-size="13" font-weight="600">CVR baixa e CPA alto apontam problema na</text><text x="603.3333333333333" y="748" fill="#f3eef6" font-size="13" font-weight="600">página ou oferta.</text><rect x="1062.6666666666665" y="214" width="477.3333333333333" height="552" rx="20" fill="url(#cardFill)" stroke="#2a1533" stroke-width="1.5" filter="url(#cardShadow)"/><rect x="1062.6666666666665" y="214" width="477.3333333333333" height="5" rx="2.5" fill="url(#accent)"/><text x="1092.6666666666665" y="250" fill="#f3eef6" font-size="21" font-weight="800">RESULTADO</text><text x="1092.6666666666665" y="269" fill="#8a3bdb" font-size="11.5" font-weight="700" letter-spacing="0.6">FATURAMENTO E LUCRO</text><line x1="1092.6666666666665" y1="292" x2="1509.9999999999998" y2="292" stroke="#1c0d22"/><text x="1092.6666666666665" y="322" fill="#8a3bdb" font-size="24" font-weight="800">AOV</text><text x="1092.6666666666665" y="336" fill="#7a6c82" font-size="9" font-weight="700" letter-spacing="0.4">TICKET MÉDIO</text><text x="1092.6666666666665" y="354" fill="#f3eef6" font-size="11.5">Valor médio por</text><text x="1092.6666666666665" y="368" fill="#f3eef6" font-size="11.5">pedido.</text><text x="1092.6666666666665" y="388" fill="#8a3bdb" font-size="11" font-weight="700">Faturamento ÷ vendas</text><text x="1311.3333333333333" y="322" fill="#8a3bdb" font-size="24" font-weight="800">ROAS</text><text x="1311.3333333333333" y="336" fill="#7a6c82" font-size="9" font-weight="700" letter-spacing="0.4">RETORNO DO ANÚNCIO</text><text x="1311.3333333333333" y="354" fill="#f3eef6" font-size="11.5">Faturamento por R$1</text><text x="1311.3333333333333" y="368" fill="#f3eef6" font-size="11.5">em mídia.</text><text x="1311.3333333333333" y="388" fill="#8a3bdb" font-size="11" font-weight="700">Faturamento ÷ anúncios</text><line x1="1092.6666666666665" y1="480" x2="1509.9999999999998" y2="480" stroke="#1c0d22"/><text x="1092.6666666666665" y="510" fill="#8a3bdb" font-size="24" font-weight="800">ROI</text><text x="1092.6666666666665" y="524" fill="#7a6c82" font-size="9" font-weight="700" letter-spacing="0.4">RETORNO TOTAL</text><text x="1092.6666666666665" y="542" fill="#f3eef6" font-size="11.5">Lucro real após</text><text x="1092.6666666666665" y="556" fill="#f3eef6" font-size="11.5">custos.</text><text x="1092.6666666666665" y="576" fill="#8a3bdb" font-size="11" font-weight="700">Lucro ÷ investimento × 100</text><text x="1311.3333333333333" y="510" fill="#8a3bdb" font-size="24" font-weight="800">LTV</text><text x="1311.3333333333333" y="524" fill="#7a6c82" font-size="9" font-weight="700" letter-spacing="0.4">VALOR DO CLIENTE</text><text x="1311.3333333333333" y="542" fill="#f3eef6" font-size="11.5">Valor no</text><text x="1311.3333333333333" y="556" fill="#f3eef6" font-size="11.5">relacionamento.</text><text x="1311.3333333333333" y="576" fill="#8a3bdb" font-size="11" font-weight="700">Ticket × compras/cliente</text><rect x="1088.6666666666665" y="688" width="425.3333333333333" height="58" rx="10" fill="#17111f" stroke="#260850"/><text x="1104.6666666666665" y="710" fill="#8a3bdb" font-size="11" font-weight="700" letter-spacing="1">COMO LER</text><text x="1104.6666666666665" y="730" fill="#f3eef6" font-size="13" font-weight="600">ROAS mede mídia. ROI confirma se sobrou</text><text x="1104.6666666666665" y="748" fill="#f3eef6" font-size="13" font-weight="600">lucro.</text><rect x="60" y="786" width="1480" height="78" rx="14" fill="url(#calloutFill)" stroke="#260850" stroke-width="1.5"/><rect x="60" y="786" width="6" height="78" rx="3" fill="#8a3bdb"/><text x="90" y="814" fill="#8a3bdb" font-size="13" font-weight="700" letter-spacing="1.2">FUNIL DAS MÉTRICAS</text><text x="90" y="838" fill="#f3eef6" font-size="17" font-weight="600">CPM &gt; CTR &gt; CPC &gt; LPV &gt; IC &gt; CVR &gt; CPA &gt; ROAS &gt; ROI — lucro real = faturamento - anúncios - taxas - impostos - custos.</text>
</svg>
